# Tells Prometheus (Component 4) to scrape the model's /metrics.
# release: kps is what the kube-prometheus-stack Prometheus selects on.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llama-cpp
  namespace: mlops
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: llama-cpp
  namespaceSelector:
    matchNames: [mlops]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
