# The agent reads cluster state to correlate incidents AND now reads pod logs +
# events to explain the exact root cause — but NEVER modifies anything.
# Strictly read-only (get/list/watch): the "LLM explains, never fixes" principle.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlops-agent-readonly
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  # read crashed pod logs (a separate permission from get pods) — for root-cause
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # read cluster events — where node/pod failure reasons show up
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # read node conditions (NotReady reason) for node-level context
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mlops-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mlops-agent-readonly
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops
