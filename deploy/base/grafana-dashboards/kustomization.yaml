apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

configMapGenerator:
  - name: mlops-golden-signals
    files:
      - golden-signals.json
    options:
      labels:
        grafana_dashboard: "1"
      # don't hash-suffix the name (stable name for the sidecar)
      disableNameSuffixHash: true
