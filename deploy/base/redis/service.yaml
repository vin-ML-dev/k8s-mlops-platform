# Headless service — gives the StatefulSet stable DNS (redis-0.redis...).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mlops
  labels:
    app: redis
spec:
  clusterIP: None            # headless
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
# ClusterIP service — what clients (gateway, agent) actually connect to.
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: mlops
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
