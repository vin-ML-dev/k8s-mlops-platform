# Prometheus scrapes the gateway's /metrics (release: kps selects it).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  namespace: mlops
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: gateway
  namespaceSelector:
    matchNames: [mlops]
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
