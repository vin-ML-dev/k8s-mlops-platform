# Child app (wave 2): the model server. After monitoring (wave 1), before the
# gateway (wave 3) which depends on the model. The model is slowest to become
# ready (download + load), so it gets an earlier wave for a head start.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: "https://github.com/vin-ML-dev/k8s-mlops-platform.git"
    targetRevision: main
    path: deploy/base/model
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
