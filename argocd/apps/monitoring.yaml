# Child app (wave 1): the kube-prometheus-stack chart, with our values file.
# MULTI-SOURCE: the chart comes from the prometheus-community Helm repo, while
# the values file lives in THIS repo and is referenced with $values.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  sources:
    - repoURL: "https://prometheus-community.github.io/helm-charts"
      chart: kube-prometheus-stack
      targetRevision: 62.7.0
      helm:
        valueFiles:
          - $values/helm/kube-prometheus-stack/values-kind.yaml
    - repoURL: "https://github.com/vin-ML-dev/k8s-mlops-platform.git"
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # big CRDs; server-side apply avoids annotation-size errors
      - CreateNamespace=true
