# The App-of-Apps root. This single Application watches the argocd/apps/ folder;
# every file in there is a child Application pointing at a component's manifests.
# Push a new child app to argocd/apps/ and the root discovers and deploys it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlops-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mlops
  source:
    repoURL: "https://github.com/vin-ML-dev/k8s-mlops-platform.git"
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
